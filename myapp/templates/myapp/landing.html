{% extends 'myapp/base.html' %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-b from-slate-950 via-slate-950 to-slate-900 text-slate-100">
  <div class="max-w-md w-full text-center">
    <div class="mx-auto h-14 w-14 rounded-2xl bg-indigo-500 shadow-lg shadow-indigo-900/40 flex items-center justify-center text-2xl font-bold text-white">₹</div>
    <h1 class="mt-6 text-3xl font-bold tracking-tight">Expense Tracker</h1>
    <p class="mt-3 text-slate-400">Track your spending, see trends by category and day, and keep your totals in check.</p>

    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{% url 'login' %}" class="rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow hover:bg-indigo-700 transition">Log in</a>
      <a href="{% url 'register' %}" class="rounded-xl border border-slate-700 bg-slate-900 px-6 py-3 text-sm font-semibold text-slate-200 hover:bg-slate-800 transition">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
